[package]
name = "engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "engine"
# staticlib: linked into the Swift app via the XCFramework (scripts/build-engine.sh).
crate-type = ["lib", "staticlib"]

[features]
# UniFFI exports for the Swift app (search). Off for the fetcher-only build.
ffi = ["dep:uniffi"]
# Adds the `uniffi-bindgen` binary used by scripts/build-engine.sh to emit the Swift bindings.
bindgen = ["ffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "mtg-fetcher"
path = "src/bin/mtg-fetcher.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
flate2 = "1.1.11"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uniffi = { version = "0.29", optional = true, features = ["tokio"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
