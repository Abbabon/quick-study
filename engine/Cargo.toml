[package]
name = "engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "engine"

[[bin]]
name = "mtg-fetcher"
path = "src/bin/mtg-fetcher.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
flate2 = "1.1.11"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
